apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  # Diversity (δt/δr/δq over 8 seeded samplings per input condition) of the GraspCVAE baseline,
  # best + latest checkpoints. Logic: kubeflow/run_diversity.sh
  # -> Experiments/eval/graspcvae_{best,latest}/diversity/{all,dexter309}/diversity_with_std.json
  name: gys-eval-graspcvae-kl10-diversity-eunha
  namespace: kbm-g-np-postech-a
spec:
  runtimeRef:
    apiGroup: trainer.kubeflow.org
    kind: TrainingRuntime
    name: pointgrasp
  trainer:
    image: postech-a.kr-central-2.kcr.dev/dmsgk724/grasp-as-you-say:latest
    numNodes: 1
    numProcPerNode: 1
    resourcesPerNode:
      limits: {cpu: "8", memory: 64Gi, nvidia.com/gpu: "1"}
    env:
      - {name: PYTHONUNBUFFERED, value: "1"}
      - {name: VARIANTS, value: "best latest"}
      - {name: N_SAMPLES, value: "8"}
      - {name: SAVE_ROOT, value: "./Experiments/graspcvae_kl10"}
      - {name: NAME, value: "graspcvae_kl10"}
    command: [/bin/bash]
    args:
      - "-lc"
      - |-
        set -euo pipefail
        cd /workspace/users/dmsgk724/dexgys_baseline_work/graspcvae
        bash kubeflow/run_diversity.sh
  podTemplateOverrides:
    - targetJobs: [{name: node}]
      metadata: {annotations: {sidecar.istio.io/inject: "false"}}
      spec:
        containers:
          - name: node
            volumeMounts: [{mountPath: /workspace, name: workspace}, {mountPath: /dev/shm, name: dshm}]
        volumes:
          - {name: workspace, persistentVolumeClaim: {claimName: cholab}}
          - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 32Gi}}
